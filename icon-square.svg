    <rect x="230" y="164" width="52" height="132" rx="12" fill="url(#up)"/>
    <line x1="362" y1="196" x2="362" y2="372" stroke="#f87171" stroke-width="12"/>
    <rect x="336" y="228" width="52" height="108" rx="12" fill="url(#dn)"/>
    <path d="M120 396 L240 340 L300 366 L400 300" fill="none" stroke="url(#ring)" stroke-width="14"/>
    <circle cx="400" cy="300" r="15" fill="#c4b5fd"/>
