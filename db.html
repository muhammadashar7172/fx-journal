<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#080b10" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Database View — FX Journal</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="manifest" href="manifest.json" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<style>
  .db-wrap{max-width:1100px;margin:26px auto;padding:0 22px}
  .db-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .db-head h1{margin:0;font-size:21px}
  .conn{font-family:"JetBrains Mono",monospace;font-size:12px;color:#7ee0a3;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.28);padding:7px 12px;border-radius:9px}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:20px}
  .panel{background:linear-gradient(160deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);margin-bottom:18px}
  .panel h2{margin:0 0 12px;font-size:14px;letter-spacing:.8px;text-transform:uppercase;color:#93a4b8}
  table.dbtable{width:100%;border-collapse:collapse;font-size:13px;min-width:0}
  table.dbtable th{text-align:left;padding:9px 10px;color:#8797a9;font-size:11px;text-transform:uppercase;letter-spacing:.9px;border-bottom:1px solid var(--line)}
  table.dbtable td{padding:9px 10px;border-bottom:1px solid var(--line-soft);font-family:"JetBrains Mono",monospace;font-size:12.5px}
  table.dbtable tr:last-child td{border-bottom:0}
  .empty{color:#5f7085;font-size:13px;padding:8px 0}
  .tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;background:rgba(139,92,246,.15);color:#c4b5fd;border:1px solid rgba(139,92,246,.3);margin-right:6px}
  .pwbtn{font-size:11px;padding:3px 9px;border-radius:999px;background:rgba(59,130,246,.14);color:#9fc4ff;border:1px solid rgba(59,130,246,.34);cursor:pointer;font-family:inherit}
  .pwbtn:hover{background:rgba(59,130,246,.24)}
  .back{font-size:13px;color:#8bb8ff;text-decoration:none}
  .back:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="db-wrap">
  <div class="db-head">
    <div>
      <h1>Database View</h1>
      <p style="margin:6px 0 0;font-size:12.5px;color:#8797a9">MongoDB me actually kya store hua hai — live view</p>
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <span class="conn" id="connInfo">connecting...</span>
      <a class="back" href="index.html">&larr; Journal</a>
    </div>
  </div>

  <div class="cards" id="cards"></div>

  <div class="panel">
    <h2>Users (accounts)</h2>
    <div id="usersBox" class="empty">Loading...</div>
  </div>

  <div class="panel">
    <h2>Meri journal data (docs collection)</h2>
    <div id="myBox" class="empty">Loading...</div>
  </div>

  <div class="panel">
    <h2>Images (imgs collection)</h2>
    <div id="imgBox" class="empty">Loading...</div>
  </div>
</div>

<script>
const fmt = (n) => n.toLocaleString("en-US");
async function run() {
  let data;
  try {
    const r = await fetch("/api/db/summary", { credentials: "same-origin" });
    if (!r.ok) throw new Error("status " + r.status);
    data = await r.json();
  } catch (e) {
    document.getElementById("connInfo").textContent = "session expired";
    document.getElementById("cards").innerHTML = '<div class="panel" style="grid-column:1/-1">Not logged in — <a class="back" href="login.html">Login</a></div>';
    return;
  }

  document.getElementById("connInfo").textContent = data.db + " @ " + data.host + (data.port && data.port !== "-" ? ":" + data.port : "");

  document.getElementById("cards").innerHTML = [
    ["Users", data.counts.users],
    ["Journal Docs", data.counts.docs],
    ["Images", data.counts.imgs],
    ["Last Saved", data.savedAt ? new Date(data.savedAt).toLocaleString("en-GB") : "—"],
  ].map(([l, v]) => `
    <div class="panel" style="margin:0">
      <div style="font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#8797a9;font-weight:700">${l}</div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:800;margin-top:8px">${v}</div>
    </div>`).join("");

  document.getElementById("usersBox").innerHTML = data.users.length
    ? `<table class="dbtable"><tr><th>#</th><th>Username</th><th>Password</th><th>Created</th></tr>${data.users.map((u, i) =>
        `<tr><td>${i + 1}</td><td>${u.username}${u.username === data.me ? " <span class='tag'>you</span>" : ""}</td>` +
        `<td>${u.username === data.me ? "<button class='pwbtn' onclick='showMyPassword(this)'>Show Password</button>" : "<span style='color:#5f7085'>—</span>"}</td>` +
        `<td>${u.createdAt ? new Date(u.createdAt).toLocaleString("en-GB") : "-"}</td></tr>`).join("")}</table>`
    : "<div class='empty'>Koi user nahi — pehle Register karein</div>";

  const st = data.state;
  if (!st || !st.cycles) {
    document.getElementById("myBox").innerHTML = "<div class='empty'>Abhi tak koi journal data save nahi hua</div>";
  } else {
    let rows = "";
    let total = 0;
    Object.values(st.cycles).forEach((c) => {
      (c.trades || []).forEach((t) => {
        if (!(t.pair || t.outcome || t.profit || t.loss || t.lot)) return;
        total++;
        rows += `<tr><td>${t.date || "-"}</td><td>${t.pair || "-"}</td><td>${t.side || "-"}</td><td>${t.outcome || "-"}</td><td>${t.profit || "0"}</td><td>${t.loss || "0"}</td><td>${t.lot || "-"}</td></tr>`;
      });
    });
    document.getElementById("myBox").innerHTML =
      `<div style="margin-bottom:10px"><span class="tag">${Object.keys(st.cycles).length} cycles</span><span class="tag">${total} trades</span></div>` +
      (rows ? `<table class="dbtable"><tr><th>Date</th><th>Pair</th><th>Side</th><th>Outcome</th><th>Profit</th><th>Loss</th><th>Lot</th></tr>${rows}</table>` : "<div class='empty'>Entries khali hain</div>");
  }

  document.getElementById("imgBox").innerHTML = data.images.length
    ? `<table class="dbtable"><tr><th>Key</th><th>Saved At</th></tr>${data.images.map((i) =>
        `<tr><td>${i.key}</td><td>${i.updatedAt ? new Date(i.updatedAt).toLocaleString("en-GB") : "-"}</td></tr>`).join("")}</table>`
    : "<div class='empty'>Koi image upload nahi hui</div>";
}
run();
</script>
<script>
async function showMyPassword(btn) {
  try {
    const r = await fetch("/api/account/recovery", { credentials: "same-origin" });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { btn.textContent = d.error || "fail"; btn.disabled = true; return; }
    btn.outerHTML = "<span class='tag' style='background:rgba(34,197,94,.15);color:#4ade80;border-color:rgba(34,197,94,.35)'>" + d.password + "</span>";
  } catch (e) { btn.textContent = "error"; btn.disabled = true; }
}
</script>
<script>
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(() => {}));
}
</script>
</body>
</html>
