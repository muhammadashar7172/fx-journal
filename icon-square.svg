<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12213a"/><stop offset="1" stop-color="#080d15"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5fd0ff"/><stop offset=".5" stop-color="#8b9dff"/><stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="up" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#15803d"/><stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="dn" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#b91c1c"/><stop offset="1" stop-color="#f87171"/>
